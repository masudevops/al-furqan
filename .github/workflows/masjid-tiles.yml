name: Refresh Masjid Finder tiles

# Rebuilds public/masjid-tiles from the latest Overture Maps Places release and opens a PR for review.
on:
  schedule:
    - cron: "0 3 2 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/masjids/requirements.txt
      - run: python scripts/masjids/build_overture_tiles.py --out public/masjid-tiles
      - name: Open pull request when tiles changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/masjid-tiles
          if git diff --cached --quiet; then echo "Tiles unchanged."; exit 0; fi
          release=$(python -c "import json;print(json.load(open('public/masjid-tiles/manifest.json'))['release'])")
          count=$(python -c "import json;print(json.load(open('public/masjid-tiles/manifest.json'))['count'])")
          branch="data/masjid-tiles-$release"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "Refresh Masjid Finder tiles from Overture $release"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" --title "Refresh Masjid Finder tiles (Overture $release)" \
            --body "Automated monthly rebuild: $count masjids from Overture Maps Places release $release. Spot-check a few cities before merging." || echo "PR already exists."
