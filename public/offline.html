<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>You're offline · Al-Furqan</title>
<!-- Shown by the service worker when a page can't load. Self-contained (no scripts or external files) so it
     works with nothing else cached. Quran text is not stored offline: Quran.Foundation limits caching to one week. -->
<style>
:root{--surface:#eee5d2;--card:#f7efde;--ink:#382f25;--muted:#796b59;--green:#526b4e;--on-green:#fff;--line:#d5c7a8}
@media (prefers-color-scheme:dark){:root{--surface:#141615;--card:#1b1e1c;--ink:#ece8df;--muted:#9a9f99;--green:#8fbfa5;--on-green:#10140f;--line:#2e332f}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--surface);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:460px;padding:32px 28px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:center}
.mark{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--green);color:var(--on-green);font:400 28px/1 "Geeza Pro","Noto Naskh Arabic",serif}
h1{margin:18px 0 8px;font:500 30px/1.2 Georgia,"Times New Roman",serif}p{margin:0 0 10px;color:var(--muted);line-height:1.6}
a{display:inline-block;margin-top:14px;padding:12px 24px;border-radius:999px;background:var(--green);color:var(--on-green);font-weight:650;text-decoration:none}
a:focus-visible{outline:3px solid var(--green);outline-offset:3px}
</style>
</head>
<body>
<main>
<span class="mark" aria-hidden="true">ف</span>
<h1>You're offline</h1>
<p>Al-Furqan needs a connection to load the Quran, Sunnah and prayer times.</p>
<p>Prayer times you added to your calendar still remind you while you're offline.</p>
<a href="/">Try again</a>
</main>
</body>
</html>
